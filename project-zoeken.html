<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ISP Barendrecht — Tab 1: Project Zoeken & Register</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Centraal Stylesheet: bewerk style.css om styling aan te passen -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#f4f7fb] p-4 sm:p-6 text-slate-800">

  <!-- ===================================================================== -->
  <!-- TAB 1: STARTSCHERM & PROJECTENREGISTER (200001 t/m 200490)            -->
  <!-- Dit bestand bevat de tabinhoud voor 'Project Zoeken & Register'.       -->
  <!-- Wordt centraal aangestuurd door project-zoeken.js en style.css.        -->
  <!-- ===================================================================== -->
  <section id="viewHomeLauncher" class="space-y-6 max-w-[1600px] mx-auto">

    <!-- SCHAALBAAR PROJECTENREGISTER (VOOR HONDERDEN PROJECTEN: 200001 t/m 200490) -->
    <div id="homeProjectListSection" class="bg-white rounded-2xl shadow-xs border border-[#dbe4f0] overflow-hidden">
      <!-- Bovenbalk van de Projectenlijst (ISP Donkerblauw) -->
      <div class="p-5 border-b border-[#163a70] flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4 bg-[#0a2246] text-white">
        <div>
          <h2 class="text-lg font-extrabold text-white">
            ISP Projectenregister
          </h2>
          <span id="homeRegisterCountBadge" class="hidden">490</span>
          <span id="homeMaxProjectNumLabel" class="hidden">200490</span>
        </div>

        <!-- Filterknoppen op het Startscherm -->
        <div class="flex flex-wrap items-center gap-2">
          <button
            type="button"
            data-home-filter="Lopend"
            class="home-filter-btn px-3.5 py-2 rounded-xl text-xs font-extrabold bg-white text-[#0a2246] shadow-xs border border-white transition cursor-pointer"
          >
            Lopend in Werkplaats (<span id="filterCountLopend" class="font-mono-num">0</span>)
          </button>
          <button
            type="button"
            data-home-filter="KNELPUNT"
            class="home-filter-btn px-3.5 py-2 rounded-xl text-xs font-semibold bg-[#12356b] text-rose-300 hover:text-white hover:bg-rose-900/40 border border-rose-400/40 transition cursor-pointer"
          >
            Lopende Knelpunten (<span id="filterCountKnelpunt" class="font-mono-num">0</span>)
          </button>
          <button
            type="button"
            data-home-filter="Afgerond"
            class="home-filter-btn px-3.5 py-2 rounded-xl text-xs font-semibold bg-[#12356b] text-blue-100 hover:text-white hover:bg-[#1a4485] border border-[#2b5fb3] transition cursor-pointer"
          >
            Afgerond Archief (<span id="filterCountAfgerond" class="font-mono-num">0</span>)
          </button>
          <button
            type="button"
            data-home-filter="ALL"
            class="home-filter-btn px-3.5 py-2 rounded-xl text-xs font-semibold bg-[#12356b] text-blue-100 hover:text-white hover:bg-[#1a4485] border border-[#2b5fb3] transition cursor-pointer"
          >
            Alle Projecten (<span id="filterCountAll" class="font-mono-num">490</span>)
          </button>
        </div>
      </div>

      <!-- Zoek- en Sorteerbalk binnen de tabel (Eén Centrale Zoek/Filterbalk) -->
      <div class="px-5 py-3.5 bg-[#f8fafc] border-b border-[#dbe4f0] flex flex-col sm:flex-row sm:items-center justify-between gap-3.5">
        <div class="relative flex-1 max-w-lg">
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-[#0a2246]">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
          </div>
          <input
            id="homeTableFilterInput"
            type="text"
            placeholder="Zoek projectnummer (bijv. 200490), klant of omschrijving..."
            class="w-full pl-10 pr-20 py-2.5 text-xs sm:text-sm bg-white border-2 border-[#cbd5e1] hover:border-[#94a3b8] focus:border-[#0a2246] focus:ring-3 focus:ring-[#0a2246]/10 rounded-xl text-[#0a2246] font-semibold placeholder:text-slate-400 placeholder:font-normal shadow-2xs transition outline-none"
            autocomplete="off"
          />
          <div class="absolute inset-y-0 right-0 pr-2.5 flex items-center gap-1.5 pointer-events-none">
            <span class="hidden sm:inline-block px-1.5 py-0.5 text-[10px] font-mono-num font-bold text-slate-400 bg-slate-100 border border-slate-200 rounded">Enter ↵</span>
          </div>
        </div>

        <div class="flex items-center gap-2.5 text-xs text-slate-600 shrink-0">
          <label for="homeSortSelect" class="font-extrabold text-[#0a2246] uppercase tracking-wider text-[11px]">Sorteer op:</label>
          <select
            id="homeSortSelect"
            class="px-3 py-2 rounded-xl bg-white border border-[#cbd5e1] text-[#0a2246] font-bold text-xs focus:outline-none focus:border-[#0a2246] shadow-2xs cursor-pointer"
          >
            <option value="NEWEST">Nieuwste eerst (200490 → 200001)</option>
            <option value="RISK">Hoogste risico / overschrijding eerst</option>
            <option value="OLDEST">Oudste eerst (200001 → 200490)</option>
          </select>
        </div>
      </div>

      <!-- Compacte, Overzichtelijke Projectentabel -->
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-[#eef3f9] border-b border-[#dbe4f0] text-xs font-extrabold uppercase tracking-wider text-[#0a2246]">
              <th class="py-3.5 px-4 w-28">Projectnr.</th>
              <th class="py-3.5 px-4">ISP Projectbenaming (Nummer • Klant • Omschrijving)</th>
              <th class="py-3.5 px-4">Fase</th>
              <th class="py-3.5 px-4">Hoe staat het ervoor?</th>
              <th class="py-3.5 px-4 text-right">Uren (Werk. / Begr.)</th>
              <th class="py-3.5 px-4 text-right">Verkoopprijs (€)</th>
              <th class="py-3.5 px-4 text-right internal-cost-field">Resultaat Budget (€)</th>
              <th class="py-3.5 px-4">Leverancier / Onderdelen</th>
              <th class="py-3.5 px-4 text-right">Statusscherm</th>
            </tr>
          </thead>
          <tbody id="homeProjectCardsGrid" class="divide-y divide-slate-200 text-xs sm:text-sm"></tbody>
        </table>
      </div>

      <!-- Paginering onderaan de tabel -->
      <div class="px-5 py-3.5 bg-[#f4f7fb] border-t border-[#dbe4f0] flex flex-wrap items-center justify-between gap-3 text-xs">
        <div id="homePaginationInfo" class="font-semibold text-slate-600">
          Toont 1–20 van 490 projecten
        </div>
        <div class="flex items-center gap-2">
          <button
            id="homePrevPageBtn"
            type="button"
            class="px-3.5 py-1.5 rounded-lg font-extrabold bg-white hover:bg-blue-50 text-[#0a2246] border border-[#dbe4f0] disabled:opacity-40 cursor-pointer"
          >
            ← Vorige pagina
          </button>
          <span id="homePageIndicator" class="font-mono-num font-bold text-[#0a2246] px-2">Pagina 1 / 1</span>
          <button
            id="homeNextPageBtn"
            type="button"
            class="px-3.5 py-1.5 rounded-lg font-extrabold bg-white hover:bg-blue-50 text-[#0a2246] border border-[#dbe4f0] disabled:opacity-40 cursor-pointer"
          >
            Volgende pagina →
          </button>
        </div>
      </div>
    </div>

  </section>

</body>
</html>
